[build-system]
requires = ["setuptools>=68.0", "wheel>=0.41.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcore-tip-mcp"
version = "0.1.0"
description = "Zero-trust MCP broker for AWS Trusted Identity Propagation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Angel Krustev / VerticalTurn Inc."}]
dependencies = [
  "boto3>=1.35.0",
  "botocore>=1.35.0",
  "pyjwt>=2.8.0",
  "cryptography>=42.0.0",
  "pydantic>=2.7.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  # MCP (Model Context Protocol) support
  "mcp>=1.0.0",
  # AgentCore Runtime helpers
  "httpx>=0.27.0",
  # Rate limiting
  "slowapi>=0.1.9",
  # JSON Schema validation
  "jsonschema>=4.20.0",
  # PEP: SQL AST guard and session store
  "sqlglot==30.22.0",
  "redis>=5.0.1",
]

[project.scripts]
agentcore-tip-mcp = "agentcore_tip.core.pep_server:main"

[tool.setuptools.packages.find]
include = ["agentcore_tip", "agentcore_tip.*"]

[tool.setuptools.package-data]
agentcore_tip = ["py.typed"]
